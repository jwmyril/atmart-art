<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATM+ Art — Atmart</title>
  <meta name="description" content="ATM+ Art, la ligne d'art numérique d'Atmart. Redirection vers l'Atelier." />
  <!-- L'adresse canonique reste atmart.ltd : ce sous-domaine est une entree de
       marque, pas une copie indexable du site. -->
  <link rel="canonical" href="https://atmart.ltd/atelier" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=https://atmart.ltd/atelier" />
  <script>location.replace("https://atmart.ltd/atelier" + location.search + location.hash);</script>
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/logo-32.png" />
  <link rel="apple-touch-icon" href="assets/logo-192.png" />
  <meta property="og:title" content="ATM+ Art" />
  <meta property="og:description" content="La ligne d'art numérique d'Atmart." />
  <meta property="og:image" content="https://art.atmart.ltd/assets/logo-512.png" />
  <meta property="og:url" content="https://atmart.ltd/atelier" />
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#060c15; color:#eaf2fb; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
           text-align:center; padding:2rem; }
    a { color:#2ec4b6; }
    p { color:#9fb3c8; font-size:0.95rem; }
    h1 { font-size:1.5rem; margin:0 0 0.5rem; letter-spacing:0.01em; }
    /* La marque est sombre sur creme : on la pose sur une carte claire plutot
       que de la poser a nu sur le fond nuit, ou elle disparaitrait. */
    .mark { width:132px; height:132px; border-radius:26px; display:block; margin:0 auto 1.4rem;
            box-shadow:0 10px 40px rgba(0,0,0,0.45); }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="assets/logo-512.png" width="132" height="132"
         alt="ATM+ Art" />
    <h1>ATM+ Art</h1>
    <p>Redirection vers l'Atelier…</p>
    <p><a href="https://atmart.ltd/atelier">atmart.ltd/atelier</a></p>
  </main>
</body>
</html>
